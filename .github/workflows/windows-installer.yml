name: Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to attach to (e.g. v1.2.0)"
        required: false

jobs:
  build-installer:
    name: Build harmus-init.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install installer script dependencies
        working-directory: scripts/windows
        run: npm ci

      - name: Build installer binary
        working-directory: scripts/windows
        run: |
          npm run build
        continue-on-error: false

      - name: Verify binary exists
        run: |
          if (Test-Path "../../dist/harmus-init.exe") {
            Write-Host "harmus-init.exe built successfully"
            (Get-Item "../../dist/harmus-init.exe").Length | ForEach-Object { Write-Host "Size: $_ bytes" }
          } else {
            Write-Error "harmus-init.exe not found"
            exit 1
          }
        shell: pwsh

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/harmus-init.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: harmus-init.exe
          path: dist/harmus-init.exe
          retention-days: 30
